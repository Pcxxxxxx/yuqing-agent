<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>舆情分析系统</title>
  <link rel="stylesheet" href="styles.css?v=plan-1" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="logo">舆情</span>
      <strong>舆情分析系统</strong>
    </div>
    <nav class="topnav" id="topnav">
      <button type="button" class="topnav__item is-active" data-module="overview">工作台</button>
      <button type="button" class="topnav__item" data-module="monitor">主题监测</button>
      <button type="button" class="topnav__item" data-module="search">全文搜索</button>
      <button type="button" class="topnav__item" data-module="event">事件分析</button>
      <button type="button" class="topnav__item" data-module="assistant">智能助手</button>
      <button type="button" class="topnav__item" data-module="settings">设置</button>
    </nav>
    <div class="topbar__right">
      <span class="user-chip">实习账号</span>
    </div>
  </header>

  <div class="shell" id="shell"></div>
  <div class="toast" id="toast" hidden></div>
  <script src="app.js?v=plan-3"></script>
</body>
</html>
